<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shubham Dhangar — DevOps &amp; AWS Cloud Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e14;
    --bg-panel: #0f151d;
    --bg-panel-alt: #131a23;
    --border: #1e2733;
    --border-soft: #182029;
    --text: #d9e2ec;
    --text-muted: #6b7a8d;
    --text-dim: #4a5568;
    --cyan: #4dd8c4;
    --amber: #f0a857;
    --red-dim: #d9736a;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(77,216,196,0.07), transparent),
      linear-gradient(var(--border-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
    background-size: auto, 48px 48px, 48px 48px;
    background-position: 0 0, -1px -1px, -1px -1px;
    overflow-x:hidden;
  }

  a{ color:inherit; text-decoration:none; }

  ::selection{ background:var(--cyan); color:#04120f; }

  :focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:3px;
  }

  .wrap{ max-width:1080px; margin:0 auto; padding:0 28px; }

  header.nav{
    position:sticky; top:0; z-index:50;
    background:rgba(10,14,20,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }

  .nav-inner{
    max-width:1080px; margin:0 auto; padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }

  .brand{
    font-family:var(--mono); font-weight:600; font-size:14px;
    color:var(--text); letter-spacing:0.02em;
    display:flex; align-items:center; gap:10px;
  }

  .brand .logo-mark{
    width:30px; height:30px; border-radius:7px; flex:none;
    background:linear-gradient(155deg, var(--cyan) 0%, #2fa596 100%);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-weight:700; font-size:12.5px; letter-spacing:-0.02em;
    color:#04120f;
    box-shadow:0 0 0 1px rgba(77,216,196,0.25), 0 4px 12px rgba(77,216,196,0.15);
    position:relative;
  }

  .brand .logo-mark::after{
    content:'';
    position:absolute; top:-3px; right:-3px;
    width:7px; height:7px; border-radius:50%;
    background:var(--amber); border:2px solid var(--bg);
  }

  nav.links{ display:flex; gap:28px; font-family:var(--mono); font-size:13px; }
  nav.links a{ color:var(--text-muted); transition:color .15s; position:relative; }
  nav.links a:hover{ color:var(--cyan); }

  .cv-btn{
    display:inline-flex; align-items:center; gap:7px;
    font-family:var(--mono); font-size:12.5px; font-weight:500; color:var(--bg);
    background:var(--cyan);
    padding:8px 14px; border-radius:6px;
    transition:filter .15s, transform .15s;
    flex:none;
  }

  .cv-btn:hover{ filter:brightness(1.08); transform:translateY(-1px); }

  @media (max-width:680px){
    nav.links{ display:none; }
    .cv-btn{ font-size:11.5px; padding:7px 11px; }
  }

  .hero-actions{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:32px; justify-content:center; }

  .btn-primary,.btn-ghost{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:13px; font-weight:500;
    padding:11px 20px; border-radius:6px;
    transition:filter .15s, transform .15s, border-color .15s, color .15s, background .15s;
  }

  .btn-primary{
    color:var(--bg);
    background:var(--cyan);
  }

  .btn-primary:hover{ filter:brightness(1.08); transform:translateY(-1px); }

  .btn-ghost{
    color:var(--text);
    background:transparent;
    border:1px solid var(--border);
  }

  .btn-ghost:hover{ border-color:var(--cyan); color:var(--cyan); transform:translateY(-1px); }

  .hero{
    padding:90px 0 64px;
    text-align:center;
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:34px;
    align-items:center;
  }

  .hero-content{
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .hero-photo-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
  }

  .hero-photo{
    width:min(360px, 85vw);
    aspect-ratio: 4 / 5;
    object-fit:cover;
    border-radius:24px;
    border:1px solid rgba(77,216,196,0.22);
    box-shadow:0 24px 80px rgba(0,0,0,0.45);
    animation: floaty 6s ease-in-out infinite, fadeUp .9s ease both;
    transform-origin:center;
  }

  .hero-photo-wrap::before{
    content:'';
    position:absolute;
    inset:10px;
    border-radius:28px;
    background:linear-gradient(135deg, rgba(77,216,196,0.18), transparent 45%, rgba(240,168,87,0.12));
    filter:blur(18px);
    z-index:-1;
    animation: glowPulse 4s ease-in-out infinite;
  }

  @keyframes floaty{
    0%,100%{ transform:translateY(0px) scale(1); }
    50%{ transform:translateY(-10px) scale(1.01); }
  }

  @keyframes glowPulse{
    0%,100%{ opacity:.55; transform:scale(1); }
    50%{ opacity:.9; transform:scale(1.02); }
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(24px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .status-line{
    font-family:var(--mono); font-size:12.5px; color:var(--cyan);
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(77,216,196,0.08);
    border:1px solid rgba(77,216,196,0.25);
    padding:6px 12px; border-radius:100px;
    margin-bottom:28px;
    animation:fadeUp .8s ease both;
  }

  .status-line .pulse{
    width:6px; height:6px; border-radius:50%; background:var(--cyan);
    animation:pulse 2s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ opacity:1; box-shadow:0 0 0 0 rgba(77,216,196,0.5); }
    50%{ opacity:0.6; box-shadow:0 0 0 5px rgba(77,216,196,0); }
  }

  h1.name{
    font-family:var(--mono); font-weight:700;
    font-size:clamp(34px,6vw,58px);
    letter-spacing:-0.01em;
    color:#f3f7fa;
    margin-bottom:10px;
    animation:fadeUp .9s ease both;
  }

  h1.name .bracket{ color:var(--text-dim); }

  .role{
    font-size:clamp(17px,2.4vw,21px);
    color:var(--text-muted);
    font-weight:400;
    margin-bottom:32px;
    animation:fadeUp 1s ease both;
  }

  .role strong{ color:var(--amber); font-weight:600; }

  .terminal{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    max-width:640px;
    margin-bottom:40px;
    width:100%;
    animation:fadeUp 1.05s ease both;
  }

  .terminal-bar{
    display:flex; align-items:center; gap:6px;
    padding:10px 14px; border-bottom:1px solid var(--border);
    background:var(--bg-panel-alt);
  }

  .terminal-bar span{ width:9px; height:9px; border-radius:50%; background:#2a3441; }
  .terminal-body{ padding:18px 20px; font-family:var(--mono); font-size:13.5px; text-align:left; }
  .terminal-body .prompt{ color:var(--cyan); }
  .terminal-body .cmd{ color:var(--text); }
  .terminal-body .out{ color:var(--text-muted); margin-top:8px; }

  .hero-stats{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:8px;
    max-width:640px;
    overflow:hidden;
    width:100%;
    animation:fadeUp 1.1s ease both;
  }

  .hero-stats div{ background:var(--bg-panel); padding:16px 18px; }
  .hero-stats .num{ font-family:var(--mono); font-size:22px; font-weight:600; color:var(--cyan); }
  .hero-stats .label{ font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px; }

  .pipeline-section{ padding:52px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); background:var(--bg-panel); overflow:hidden; }
  .pipeline-label{ font-family:var(--mono); font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:28px; text-align:center; }
  .pipeline{ position:relative; display:flex; justify-content:space-between; align-items:center; max-width:820px; margin:0 auto; padding:0 10px; }
  .pipeline::before{
    content:'';
    position:absolute; left:24px; right:24px; top:15px; height:1px;
    background:repeating-linear-gradient(90deg, var(--border) 0 6px, transparent 6px 12px);
  }
  .pipeline::after{
    content:'';
    position:absolute; top:13px; width:5px; height:5px; border-radius:50%;
    background:var(--amber); box-shadow:0 0 10px var(--amber);
    animation:travel 6s linear infinite;
  }
  @keyframes travel{
    0%{ left:24px; opacity:0; }
    5%{ opacity:1; }
    95%{ opacity:1; }
    100%{ left:calc(100% - 29px); opacity:0; }
  }

  .stage{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:10px; flex:1; }
  .stage .node{ width:31px; height:31px; border-radius:50%; background:var(--bg); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; }
  .stage .node::before{ content:''; width:7px; height:7px; border-radius:50%; background:var(--text-dim); }
  .stage.active .node{ border-color:var(--cyan); }
  .stage.active .node::before{ background:var(--cyan); }
  .stage span.name{ font-family:var(--mono); font-size:11px; color:var(--text-muted); letter-spacing:0.04em; text-align:center; }

  @media (max-width:860px){
    .hero{
      grid-template-columns:1fr;
      padding-top:70px;
    }
    .hero-photo-wrap{
      order:-1;
      margin-bottom:10px;
    }
  }

  @media (max-width:640px){
    .pipeline{ overflow-x:auto; }
    .stage span.name{ font-size:9.5px; }
    .hero-stats{ grid-template-columns:1fr; }
  }

  section{ padding:80px 0; }
  .section-head{ display:flex; align-items:baseline; gap:14px; margin-bottom:40px; }
  .section-head .idx{ font-family:var(--mono); color:var(--text-dim); font-size:13px; }
  .section-head h2{ font-family:var(--mono); font-size:22px; font-weight:600; color:#f3f7fa; }
  .section-head .rule{ flex:1; height:1px; background:var(--border); }

  .about-block,.contact-block,.skill-card,.project-card,.edu-card{
    opacity:0;
    transform:translateY(16px);
    animation:fadeUp .8s ease forwards;
  }

  .about-block{
    background:var(--bg-panel); border:1px solid var(--border); border-radius:8px;
    padding:28px 30px;
  }

  .about-block .filename{ font-family:var(--mono); font-size:11.5px; color:var(--text-dim); margin-bottom:16px; letter-spacing:0.04em; }
  .about-block p{ color:var(--text-muted); font-size:15px; margin-bottom:14px; }
  .about-block p:last-child{ margin-bottom:0; }
  .about-block strong{ color:var(--text); font-weight:600; }

  .skills-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; }
  .skill-card{
    background:var(--bg-panel); border:1px solid var(--border); border-radius:8px; padding:20px 22px;
    transition:border-color .15s, transform .15s;
  }
  .skill-card:hover{ border-color:rgba(77,216,196,0.35); transform:translateY(-3px); }
  .skill-card .key{ font-family:var(--mono); font-size:12px; color:var(--amber); margin-bottom:10px; }
  .skill-card .val{ font-size:13.5px; color:var(--text-muted); line-height:1.7; }

  .timeline{ position:relative; padding-left:28px; }
  .timeline::before{ content:''; position:absolute; left:5px; top:6px; bottom:6px; width:1px; background:var(--border); }
  .tl-item{ position:relative; padding-bottom:36px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-item::before{ content:''; position:absolute; left:-28px; top:5px; width:11px; height:11px; border-radius:50%; background:var(--bg); border:2px solid var(--cyan); }
  .tl-item .role-title{ font-weight:600; font-size:16px; color:#f3f7fa; }
  .tl-item .org{ color:var(--cyan); font-family:var(--mono); font-size:13px; margin-top:2px; }
  .tl-item .dates{ color:var(--text-dim); font-family:var(--mono); font-size:12px; margin-top:6px; }

  .projects-grid{ display:grid
